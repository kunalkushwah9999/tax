# Install generated web/ at /opt/taxdesk-site/web; protect origin with DNS/TLS.
# API responses retain the backend's no-store and security headers. No proxy cache.
server {
    listen 80;
    server_name @@HOSTNAME@@;
    if ($http_host != "@@HOSTNAME@@") { return 421; }
    return 308 @@ORIGIN@@$request_uri;
}
server {
    listen 443 ssl;
    server_name @@HOSTNAME@@;
    if ($http_host != "@@HOSTNAME@@") { return 421; }
    ssl_certificate /etc/taxdesk/tls/fullchain.pem;
    ssl_certificate_key /etc/taxdesk/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/taxdesk-site/web;
    index index.html;
    client_max_body_size 65536;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; worker-src 'self'; manifest-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    location ~ ^/api/cases/[A-Za-z0-9_-]+/itr-native-preview$ {
        client_max_body_size 400000;
        include /etc/nginx/taxdesk-proxy.conf;
    }
    location /api/ { include /etc/nginx/taxdesk-proxy.conf; }
    location = /manifest.webmanifest { default_type application/manifest+json; try_files $uri =404; }
    location = /account-deletion { default_type text/html; try_files /account-deletion.html =404; }
    location = /.well-known/assetlinks.json { default_type application/json; try_files $uri =404; }
    location ~ ^/\. { return 404; }
    location / { try_files $uri =404; }
}
